<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | SOXIT Academia</title>
  <style>
    :root {
      --navy: #07152d;
      --muted: #58718e;
      --green: #08aa7b;
      --border: #dce5ee;
      --panel: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: var(--navy);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      padding: 0 3.2%;
      border-bottom: 1px solid #eef2f6;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      color: var(--navy);
      font-size: 1.55rem;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 10px;
      background: var(--green);
      color: #ffffff;
      font-size: 1.55rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .home-link {
      color: #455a75;
      font-weight: 600;
      text-decoration: none;
    }

    .contact-button {
      padding: 16px 27px;
      border-radius: 9px;
      background: var(--green);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .contact-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 0.95fr);
      gap: 6.5%;
      max-width: 1450px;
      margin: 0 auto;
      padding: 58px 4.5% 60px;
    }

    .contact-copy { padding-top: 4px; }

    h1 {
      margin-bottom: 24px;
      color: var(--navy);
      font-size: clamp(2.8rem, 5vw, 4rem);
      line-height: 1.05;
    }

    .intro {
      max-width: 650px;
      margin-bottom: 62px;
      color: var(--muted);
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      line-height: 1.8;
    }

    .details { display: grid; gap: 28px; }

    .detail {
      display: flex;
      align-items: center;
      gap: 26px;
      color: #17375f;
      font-size: 1.2rem;
    }

    .detail-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: var(--green);
      font-size: 1.85rem;
      line-height: 1;
    }

    .form-card {
      padding: 60px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
    }

    form { display: grid; gap: 30px; }

    input, textarea {
      width: 100%;
      padding: 21px 25px;
      border: 1px solid #cbd8e6;
      border-radius: 12px;
      background: #ffffff;
      color: var(--navy);
      font: inherit;
      font-size: 1.2rem;
      outline: none;
    }

    textarea { min-height: 188px; resize: vertical; }

    input:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8, 170, 123, 0.12);
    }

    input::placeholder, textarea::placeholder { color: #8ca0b9; }

    button {
      padding: 22px;
      border: 0;
      border-radius: 12px;
      background: #0b1429;
      color: #ffffff;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #16233d; }
    .status { color: var(--green); font-weight: 600; }

    @media (max-width: 800px) {
      .site-header { padding: 16px 5%; }
      .home-link { display: none; }
      .contact-layout { grid-template-columns: 1fr; gap: 42px; padding: 42px 6% 50px; }
      .intro { margin-bottom: 38px; }
      .form-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><span class="brand-mark">S</span><span>SOXIT</span></a>
    <div class="header-actions">
      <a href="index.html" class="home-link">Academia</a>
      <a href="#contact-form" class="contact-button">Contact Us</a>
    </div>
  </header>

  <main class="contact-layout">
    <section class="contact-copy" aria-labelledby="contact-title">
      <h1 id="contact-title">Get in Touch</h1>
      <p class="intro">Whether you are looking for strategic advisory, workforce solutions, or creative infrastructure, our team is ready to help.</p>
      <div class="details">
        <div class="detail"><span class="detail-icon" aria-hidden="true">&#9993;</span><span>info@soxit.com</span></div>
        <div class="detail"><span class="detail-icon" aria-hidden="true">&#9742;</span><span>+1 (555) 123-4567</span></div>
        <div class="detail"><span class="detail-icon" aria-hidden="true">&#9678;</span><span>Global HQ, Tech Park, Metropolis</span></div>
      </div>
    </section>

    <section class="form-card" aria-label="Contact form">
      <form id="contact-form">
        <input name="name" type="text" placeholder="Name" aria-label="Name" autocomplete="name" required>
        <input name="email" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
        <textarea name="message" placeholder="Message" aria-label="Message" required minlength="10" maxlength="2000"></textarea>
        <button type="submit">Send Message</button>
        <p class="status" id="contact-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('contact-status').textContent = 'Thank you. Our team will contact you soon.';
      this.reset();
    });
  </script>
<script src="../site-shell.js"></script>
</body>
</html>
